<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Pantry Pal test versions</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #FEF8EE; color: #1D3B28; font-family: system-ui, sans-serif; }
      main { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
      h1 { margin: 0; font-size: 28px; }
      p { margin: 0 0 8px; }
      a { display: block; padding: 18px 20px; border-radius: 14px; background: #1D3B28; color: #FEF8EE; font-weight: 600; font-size: 18px; text-decoration: none; }
      a span { display: block; margin-top: 2px; font-weight: 400; font-size: 15px; }
      a:focus-visible { outline: 3px solid #BA9F38; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Pantry Pal</h1>
      <p>Choose a version to open.</p>
      <a href="A/">Version A<span>Control</span></a>
      <a href="B/">Version B<span>Impact message</span></a>
    </main>
  </body>
</html>
